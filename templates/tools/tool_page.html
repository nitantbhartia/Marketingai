<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | ClaimCoach</title>
    <meta name="description" content="{{ description }}">
    <!-- OG -->
    <meta property="og:title" content="{{ title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://claimcoach.app/tools/{{ slug }}">
    <meta name="twitter:card" content="summary_large_image">
    <!-- Canonical -->
    <link rel="canonical" href="https://claimcoach.app/tools/{{ slug }}">
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tool styles -->
    <link rel="stylesheet" href="/static/tools/tools.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }
        .tool-page-header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 16px 24px;
        }
        .tool-page-header a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        .tool-page-nav {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .tool-page-logo {
            font-weight: 800;
            font-size: 18px;
            color: #0f172a;
        }
        .tool-page-body {
            max-width: 720px;
            margin: 40px auto;
            padding: 0 24px;
        }
        .tool-page-footer {
            max-width: 720px;
            margin: 60px auto 40px;
            padding: 24px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        .tool-page-footer a { color: #2563eb; text-decoration: none; }
        /* FAQ accordion */
        .tool-faq { margin: 40px 0; }
        .tool-faq h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .tool-faq details {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px 0;
        }
        .tool-faq summary {
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #0f172a;
        }
        .tool-faq details p {
            font-size: 14px;
            color: #475569;
            margin: 8px 0 4px 0;
        }
    </style>
</head>
<body>
    <header class="tool-page-header">
        <nav class="tool-page-nav">
            <span class="tool-page-logo">ClaimCoach</span>
            <a href="https://claimcoach.app">Home</a>
            <a href="https://claimcoach.app/blog">Blog</a>
            <a href="/tools">All Tools</a>
        </nav>
    </header>

    <main class="tool-page-body">
        <div data-cc-tool="{{ tool_id }}" data-mode="full" data-state="{{ state or '' }}"></div>

        {% if faqs %}
        <div class="tool-faq">
            <h2>Frequently Asked Questions</h2>
            {% for faq in faqs %}
            <details>
                <summary>{{ faq.q }}</summary>
                <p>{{ faq.a }}</p>
            </details>
            {% endfor %}
        </div>
        {% endif %}
    </main>

    <footer class="tool-page-footer">
        <p>&copy; {{ year }} ClaimCoach. This tool provides estimates only and does not constitute legal or financial advice.</p>
        <p><a href="https://claimcoach.app">Get your full settlement analysis</a></p>
    </footer>

    <!-- Tool data (inline to avoid extra fetch) -->
    <script id="cc-tool-data" type="application/json">{{ tool_data_json | safe }}</script>
    <script src="/static/tools/tools.js"></script>
</body>
</html>
